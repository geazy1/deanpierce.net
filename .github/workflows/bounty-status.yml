name: Bounty status monitor (every 3 hours)
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bounty-status.yml'
      - '.bounty-monitor/check_bounties.py'
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read
  actions: read
concurrency:
  group: bounty-status-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'geazy1/deanpierce.net'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download and verify the pinned monitor, not PR code
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, urllib.request
          sha = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          url = f'https://raw.githubusercontent.com/geazy1/deanpierce.net/{sha}/.bounty-monitor/check_bounties.py'
          with urllib.request.urlopen(url, timeout=25) as response:
              data = response.read(100000)
          assert hashlib.sha256(data).hexdigest() == '853c6bec5023aef24bb1ae75fc4f5462b7e250d2875db1c42db569ed70da322b'
          pathlib.Path('/tmp/check_bounties.py').write_bytes(data)
          PY
      - name: Test monitor logic offline
        run: python3 /tmp/check_bounties.py --self-test
      - name: Review all four correction submissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('bounty_monitor', '/tmp/check_bounties.py')
          monitor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(monitor)
          monitor.TRACKED.update({
              5: {
                  'sha': 'd681961ee9c6efde4ff5dd523e74968e1cecd1fe',
                  'run': 34062335896,
                  'file': 'docs/talks/lateral-movement-in-linux-environments.md',
                  'blob': 'e194affd30139a21607422faab0774df809c473f',
              },
              6: {
                  'sha': '2a36dabcb5362ce4bb54999f5cff6bf3e38e5a08',
                  'run': 34062335896,
                  'file': 'docs/projects/zk-bounty.md',
                  'blob': '2b4ebb93b397c4e1163825fc9b0c30bb9ce0d423',
              },
          })
          assert set(monitor.TRACKED) == {3, 4, 5, 6}
          raise SystemExit(monitor.main())
          PY
