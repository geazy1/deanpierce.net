name: Discover eligible agent jobs
on:
  push:
    branches: [research/independent-cash-work]
    paths: ['.github/workflows/discover-agent-jobs.yml']
permissions: {}
jobs:
  research:
    if: github.repository == 'geazy1/deanpierce.net'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Install encryption dependency in isolated environment
        run: |
          python3 -m venv /tmp/earn-research
          /tmp/earn-research/bin/pip install -q cryptography
      - name: Register once and read paid-work feed; encrypt credentials
        run: |
          /tmp/earn-research/bin/python - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          from datetime import datetime, timezone
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          public = b'''-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEApDUSMHdYJx9mCvwv8Xfm
          2WFJPM0LhnqeuRwpmJOIjiZAJc8rtg3fzqiGcLKNRLbrOBYYQCduuSHsz199sjs0
          hFP2hFeUGwfGM8KbVEOg7NWdbc93LHEBpFRFfEWHZxg5aJjgZjV50hKAbgtC5PwZ
          voYD1LV2ZQ6euy6zqLfje/xQ1aLjBhXAleLYWKjzzGDJp/pkdD7b3g2Lwkwl0SkV
          MdDkId8DgoApdISFjfcgrLlF/PqX17GxViWCPTkdZW3mZ4GiRtZOKRQc11eSFDub
          0W9yCDzNgkxXyMkLsYlBZUuijX93086toSrmKrAVv6OkpcvObcn30xsD0KiDS4UI
          AQIDAQAB
          -----END PUBLIC KEY-----'''
          key = serialization.load_pem_public_key(public)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise RuntimeError('Unexpected redirect; stopping')
          opener=urllib.request.build_opener(NoRedirect())
          base='https://superteam.fun'
          req=urllib.request.Request(base+'/api/agents',data=json.dumps({'name':'geazy1-research-agent'}).encode(),headers={'Content-Type':'application/json','User-Agent':'authorized-agent-work-research'},method='POST')
          try:
              with opener.open(req,timeout=25) as r: data=r.read(20000)
          except urllib.error.HTTPError as exc:
              print('REGISTRATION_HTTP_STATUS',exc.code)
              raise SystemExit(1)
          response=json.loads(data)
          assert 'apiKey' in response and 'claimCode' in response
          for field in ('apiKey','claimCode'):
              print('::add-mask::'+response[field],flush=True)
          aeskey=AESGCM.generate_key(bit_length=256); nonce=os.urandom(12)
          cipher=AESGCM(aeskey).encrypt(nonce,data,b'earn-research-registration')
          wrapped=key.encrypt(aeskey,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          enc=lambda value: base64.b64encode(value).decode()
          print('ENCRYPTED_REGISTRATION',json.dumps({'key':enc(wrapped),'nonce':enc(nonce),'ciphertext':enc(cipher)}),flush=True)
          print('AGENT_REGISTERED',response.get('agentId'),response.get('username'),flush=True)
          now=datetime.now(timezone.utc).isoformat()
          from urllib.parse import urlencode
          url=base+'/api/agents/listings/live?'+urlencode({'take':50,'deadline':now})
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+response['apiKey'],'User-Agent':'authorized-agent-work-research'})
          with opener.open(req,timeout=25) as r: data=r.read(2_000_001)
          assert len(data)<=2_000_000
          listings=json.loads(data)
          assert isinstance(listings,list)
          print('VERIFIED_SPONSOR_AGENT_LISTINGS',len(listings),flush=True)
          for listing in listings:
              allowed=['id','slug','title','type','deadline','rewardAmount','token','rewards','region','agentAccess','isWinnersAnnounced','sponsor','totalSubmissions']
              print('LISTING',json.dumps({k:listing[k] for k in allowed if k in listing}),flush=True)
          PY
