name: Inspect public paid-work listings
on:
  push:
    branches: [research/independent-cash-work]
    paths: ['.github/workflows/inspect-paid-listings.yml']
permissions: {}
jobs:
  inspect:
    if: github.repository == 'geazy1/deanpierce.net'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read unexpired public listings
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = 'https://superteam.fun/api/listings/live?take=50&deadline=2026-09-06T22%3A00%3A00Z'
          req = urllib.request.Request(url,headers={'User-Agent':'public-paid-work-research','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r: raw=r.read(2_000_001)
          assert len(raw)<=2_000_000
          data=json.loads(raw)
          assert isinstance(data,list)
          print('UNEXPIRED_LISTINGS',len(data),flush=True)
          for row in data:
              sponsor=row.get('sponsor') or {}
              out={k:v for k,v in row.items() if k not in ['sponsor']}
              out['sponsor']={k:sponsor.get(k) for k in ['name','slug','isVerified']}
              print(json.dumps(out),flush=True)
          PY
